<!-- Modal -->
<div class="modal fade" id="urlModal" tabindex="-1" role="dialog" aria-labelledby="urlModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="urlModalLabel">¿?</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="embed-responsive embed-responsive-16by9">
          <iframe class="embed-responsive-item" id="modalIframe" src="" style="border:none;"></iframe>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Select all links with the class 'modal-link'
    const modalLinks = document.querySelectorAll('a.modal-link');

    modalLinks.forEach(link => {
      link.addEventListener('click', function (event) {
        event.preventDefault(); // Prevent default navigation

        const targetUrl = this.getAttribute('href');
        let modalTitle = this.getAttribute('title') || '';

        // Check if the first child is an <img> and it's the only content inside <a>
        const firstChild = this.firstElementChild;
        if (!modalTitle && firstChild && firstChild.tagName === 'IMG' && this.childElementCount === 1) {
          modalTitle = firstChild.getAttribute('title') || firstChild.getAttribute('alt') || '';
        }

        const modalIframe = document.getElementById('modalIframe');
        const modalTitleElement = document.getElementById('urlModalLabel');

        // Set the iframe's src to the target URL
        modalIframe.src = targetUrl;

        // Set the modal title
        modalTitleElement.textContent = modalTitle;

        // Show the modal
        $('#urlModal').modal('show');
      });
    });

    // Clear the iframe src when the modal is closed
    $('#urlModal').on('hidden.bs.modal', function () {
      document.getElementById('modalIframe').src = '';
    });
  });
</script>
